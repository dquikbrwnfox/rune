<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Unofficial UWI St. Augustine timetable builder: pick courses, spot clashes, solve for a clash-free week.">
<title>UWI Timetable</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}#status{font:16px system-ui;padding:24px}</style>
<div id="status">Loading…</div>
<!-- Start on the GPU at once: the lit scene and its effects need it, and a CPU-first start
     (Rune's default for full-window apps) shows a frame without them first. -->
<script>globalThis.RUNE_CPU_FIRST = "off";</script>
<script type="module">
import init from './app.js';
try {
    if (!navigator.gpu) throw new Error('This page needs WebGPU: use a recent Chrome or Edge (or Safari 26+), over HTTPS.');
    await init();
    document.querySelector('#status').remove();
} catch (error) {
    document.querySelector('#status').textContent = String(error);
    console.error(error);
}
</script>
</html>
