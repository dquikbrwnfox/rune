[package]
name = "timetable"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["fx"]
# Shader effects (liquid-metal seal, shockwave, sparkles, sheen, paper grain) through rune-fx.
fx = ["dep:rune-fx", "dep:rune-light", "dep:wgpu"]

[dependencies]
rune = { path = "../../crates/rune" }
rune-kit = { path = "../../crates/rune-kit" }
rune-fx = { path = "../../crates/rune-fx", optional = true }
rune-light = { path = "../../crates/rune-light", optional = true }
wgpu = { version = "30", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
